[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sutura"
version = "0.1.0"
description = "Sutura - an agentic, local-first CLI for spatial transcriptomics alignment and 3D reconstruction (Claude Code for spatial data)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Sutura Genomics" }]
keywords = ["spatial-transcriptomics", "alignment", "visium", "xenium", "anndata", "tui", "agent"]

# The heavy alignment engine (scanpy / torch / POT / paste2) is provided by the
# repository environment that Sutura wraps. These are the CLI-layer deps.
dependencies = [
    "rich>=13.7",
    "textual>=0.60",
    "numpy>=1.24",
    "anndata>=0.10",
]

[project.optional-dependencies]
# Cloud LLM backend (metadata-only). Local Ollama backend needs no extra pip dep.
cloud = ["anthropic>=0.40"]
# Present so `pip install sutura` in a fresh env can also pull the engine.
engine = ["scanpy>=1.10", "scipy>=1.10", "torch>=2.2"]
dev = ["pytest>=7.0"]

[project.scripts]
sutura = "sutura_cli.cli:main"

[tool.setuptools]
packages = ["sutura_cli", "sutura_cli.core", "sutura_cli.tui"]

[tool.setuptools.package-data]
sutura_cli = ["assets/*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
